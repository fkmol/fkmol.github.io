<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f5f6f8">
<meta name="format-detection" content="telephone=no">
<title>PicaComic 收藏画廊</title>
<style>
*{box-sizing:border-box}
:root{
  --bg:#f5f6f8; --card:#fff; --line:#e4e7ec; --txt:#1f2328; --sub:#6b7280;
  --accent:#2563eb; --accent-soft:#e8efff;
  --cat:#0f766e; --cat-soft:#e3f3f0;
  --tag:#7c3aed; --tag-soft:#f1ecfe;
}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--txt);
  font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",
       "Hiragino Sans GB","Microsoft YaHei",sans-serif;
}
body.lock{overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
img{display:block}
[hidden]{display:none !important}

/* ── 顶栏 ── */
header{
  position:sticky;top:0;z-index:30;background:rgba(255,255,255,.95);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--line);
}
.bar{max-width:1400px;margin:0 auto;padding:10px 16px 0}
.row1{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-size:17px;font-weight:700;margin:0;white-space:nowrap}
.brand em{font-style:normal;color:var(--sub);font-weight:500;font-size:12px;margin-left:6px}
.search{position:relative;flex:1 1 260px;min-width:200px;max-width:460px}
.search input{
  width:100%;padding:8px 30px 8px 32px;border:1px solid var(--line);border-radius:9px;
  background:#fff;outline:none;transition:.15s;
}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.search .ico{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--sub);font-size:13px}
.search .clr{
  position:absolute;right:4px;top:50%;transform:translateY(-50%);border:0;background:none;
  color:var(--sub);font-size:16px;line-height:1;padding:4px 6px;border-radius:6px;display:none;
}
.search.has .clr{display:block}
.search .clr:hover{background:#eef0f3;color:var(--txt)}
.tools{display:flex;align-items:center;gap:8px;margin-left:auto;flex-wrap:wrap}
.tools select{
  padding:7px 8px;border:1px solid var(--line);border-radius:8px;background:#fff;outline:none;
}
.btn{
  padding:7px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;
  transition:.15s;white-space:nowrap;
}
.btn:hover{border-color:#c9ced6;background:#fafbfc}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn:disabled{opacity:.4;cursor:default}

/* ── 已选条件 ── */
.selbar{
  display:flex;flex-wrap:wrap;align-items:center;gap:6px;
  padding:8px 0 4px;margin-top:6px;border-top:1px dashed var(--line);
}
.slab{font-size:12px;color:var(--sub);margin-right:2px}

/* ── 筛选区 ── */
.filters{padding:2px 0 8px}
.frow{display:flex;gap:8px;align-items:flex-start;padding:3px 0}
.flabel{
  flex:0 0 auto;font-size:12px;color:var(--sub);padding-top:5px;min-width:34px;
  display:flex;align-items:center;gap:6px;
}
.fbody{flex:1;min-width:0}
.tbar{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.tagq{
  flex:0 0 160px;padding:4px 8px;border:1px solid var(--line);border-radius:7px;
  font-size:12px;outline:none;background:#fff;transition:.15s;
}
.tagq:focus{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.chips{
  flex:1;display:flex;flex-wrap:wrap;gap:6px;max-height:58px;overflow-y:auto;
  scrollbar-width:thin;align-content:flex-start;
}
.chips.wide{max-height:none}
.chip{
  border:1px solid var(--line);background:#fff;border-radius:999px;
  padding:3px 9px;font-size:12px;line-height:1.5;transition:.12s;
  display:inline-flex;align-items:center;gap:5px;
}
.chip i{font-style:normal;color:#9aa1ab;font-size:11px}
.chip:hover{border-color:#c9ced6;background:#fafbfc}
.chip.cat.on{background:var(--cat-soft);border-color:var(--cat);color:var(--cat);font-weight:600}
.chip.tag.on{background:var(--tag-soft);border-color:var(--tag);color:var(--tag);font-weight:600}
.chip.on i{color:inherit;opacity:.75}
.chip.hide{display:none}
.chip.dead{opacity:.35;cursor:default}
.chip.dead:hover{border-color:var(--line);background:#fff}
.mini{
  border:0;background:none;color:var(--accent);font-size:12px;padding:3px 6px;
  border-radius:6px;white-space:nowrap;
}
.mini:hover{background:var(--accent-soft)}
.mini.off{color:var(--sub);background:#eef0f3}
.tagempty{font-size:12px;color:var(--sub);padding:4px 2px}

/* ── 筛选弹窗 ── */
#fmodal{position:fixed;inset:0;z-index:70;display:flex;align-items:center;justify-content:center;padding:24px}
.fmask{position:absolute;inset:0;background:rgba(12,16,24,.55)}
.fpanel{
  position:relative;background:#fff;border-radius:14px;width:100%;max-width:1000px;
  height:78vh;display:flex;flex-direction:column;overflow:hidden;
  box-shadow:0 20px 60px rgba(0,0,0,.28);
}
.fhead{display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid var(--line)}
.fhead h2{margin:0;font-size:15px;white-space:nowrap}
.fq{
  flex:1;min-width:0;padding:7px 10px;border:1px solid var(--line);border-radius:8px;
  outline:none;font-size:13px;transition:.15s;
}
.fq:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.fx{
  border:0;background:none;font-size:22px;line-height:1;color:var(--sub);
  padding:2px 8px;border-radius:8px;
}
.fx:hover{background:#eef0f3;color:var(--txt)}
.fmbody{flex:1;display:flex;min-height:0}
.fcol{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0;padding:12px 14px}
.fcol + .fcol{border-left:1px solid var(--line)}
.fcol h3{
  margin:0 0 10px;font-size:13px;color:var(--sub);font-weight:600;
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;
}
.fcol h3 em{font-style:normal;font-weight:400;font-size:12px;color:#9aa1ab;margin-left:auto}
.fchips{
  flex:1;overflow-y:auto;display:flex;flex-wrap:wrap;gap:6px;
  align-content:flex-start;padding-right:4px;scrollbar-width:thin;
  min-height:0;overscroll-behavior:contain;
}
.ffoot{
  display:flex;align-items:center;gap:10px;padding:10px 14px;
  border-top:1px solid var(--line);background:#fafbfc;
}
.fsel{
  flex:1;display:flex;flex-wrap:wrap;gap:6px;align-items:center;
  max-height:62px;overflow-y:auto;min-width:0;
}
.fact{display:flex;align-items:center;gap:8px;flex:0 0 auto}
.fact span{font-size:12px;color:var(--sub);white-space:nowrap}
.fempty{width:100%;text-align:center;color:#9aa1ab;font-size:13px;padding:30px 0}

/* ── 网格 ── */
main{max-width:1400px;margin:0 auto;padding:18px 16px 60px}
.grid{
  display:grid;gap:14px;
  grid-template-columns:repeat(auto-fill,minmax(168px,1fr));
}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;
  cursor:pointer;transition:transform .14s,box-shadow .14s,border-color .14s;
  content-visibility:auto;contain-intrinsic-size:auto 300px;
}
.card:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(20,30,60,.09);border-color:#cdd4de}
.thumb{position:relative;aspect-ratio:3/4;background:#eceff3;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb.noimg::after{
  content:"无缩略图";position:absolute;inset:0;display:flex;align-items:center;
  justify-content:center;color:#9aa1ab;font-size:12px;
}
.meta{padding:8px 10px 10px}
.meta h3{
  margin:0 0 2px;font-size:13px;font-weight:600;line-height:1.35;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.meta .author{
  margin:0;font-size:12px;color:var(--sub);white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;
}
.badges{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.b{
  font-size:11px;padding:1px 6px;border-radius:999px;line-height:1.5;
  white-space:nowrap;border:0;
}
.b.cat{background:var(--cat-soft);color:var(--cat)}
.b.tag{background:var(--tag-soft);color:var(--tag)}
.b.pg{background:#eef0f3;color:#5b6270}
button.b{cursor:pointer;transition:.12s}
button.b:hover{filter:brightness(.93);box-shadow:0 0 0 1px currentColor inset}

.empty{text-align:center;color:var(--sub);padding:70px 20px;font-size:14px}
#sentinel{height:1px}
.loadmore{display:flex;justify-content:center;padding:24px 0 10px}
#top{
  position:fixed;right:18px;bottom:18px;z-index:25;width:42px;height:42px;border-radius:50%;
  border:1px solid var(--line);background:#fff;box-shadow:0 4px 14px rgba(20,30,60,.12);
  font-size:16px;display:none;
}
#top.show{display:block}

/* ── 模态框 ── */
#modal{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:20px}
.mask{position:absolute;inset:0;background:rgba(12,16,24,.72)}
.box{
  position:relative;background:#fff;border-radius:14px;max-width:1080px;width:100%;
  max-height:92vh;overflow:auto;display:flex;gap:0;box-shadow:0 20px 60px rgba(0,0,0,.3);
}
.box .pic{flex:0 0 52%;background:#0e1116;display:flex;align-items:center;justify-content:center;
  min-height:220px;position:relative;border-radius:14px 0 0 14px}
.box .pic img{max-width:100%;max-height:92vh;object-fit:contain;transition:opacity .2s}
.spin{
  position:absolute;width:26px;height:26px;border:2px solid rgba(255,255,255,.25);
  border-top-color:#fff;border-radius:50%;animation:sp .8s linear infinite;
}
@keyframes sp{to{transform:rotate(360deg)}}
.miss{position:absolute;color:#c9ced6;font-size:13px;text-align:center;padding:0 20px;line-height:1.8}
.info{flex:1;padding:20px 22px;min-width:0}
.info h2{margin:0 0 8px;font-size:17px;line-height:1.4}
.info .kv{margin:0 0 4px;font-size:13px;color:var(--sub)}
.info .kv b{color:var(--txt);font-weight:500}
.info .desc{
  margin:12px 0 0;padding:10px 12px;background:#f7f8fa;border-radius:9px;
  font-size:13px;white-space:pre-wrap;word-break:break-word;max-height:34vh;overflow:auto;
}
.info .link{display:inline-block;margin-top:12px;font-size:12px;color:var(--accent)}
.close{
  position:absolute;right:10px;top:10px;z-index:2;width:32px;height:32px;border-radius:50%;
  border:0;background:rgba(255,255,255,.9);font-size:18px;line-height:1;box-shadow:0 2px 8px rgba(0,0,0,.15);
}
.nav{position:absolute;top:50%;transform:translateY(-50%);z-index:2;width:38px;height:38px;
  border-radius:50%;border:0;background:rgba(255,255,255,.9);font-size:20px;line-height:1;
  box-shadow:0 2px 8px rgba(0,0,0,.15)}
.nav:hover{background:#fff}
.nav:disabled{opacity:.25}
#mprev{left:8px} #mnext{right:8px}

/* ── 手机 / 窄屏 ── */
@media (max-width:760px){
  /* 输入框统一 16px，否则 iOS 聚焦时会自动放大页面 */
  input,select,textarea{font-size:16px}

  /* 顶栏 */
  /* 手机上顶栏很高（搜索 + 两行筛选），吸顶会把可视区吃掉近一半，改成随页滚动 */
  header{position:static}
  .bar{padding:8px 12px 0}
  .row1{gap:8px}
  .brand{font-size:16px}
  .brand em{display:none}
  .search{flex:1 1 100%;order:3;max-width:none;min-width:0}
  .tools{margin-left:auto}
  .filters{padding:2px 0 6px}
  .tbar{flex-wrap:wrap}
  .tagq{flex:1 1 140px;min-width:0}
  /* 顶栏的分类/标签：改成单行横向滑动，避免 max-height 切出半截第二行 */
  .frow .chips{
    max-height:none;flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;
    padding-bottom:6px;scrollbar-width:none;-webkit-overflow-scrolling:touch;
  }
  .frow .chips::-webkit-scrollbar{display:none}
  .frow .chip{flex:0 0 auto;white-space:nowrap}
  .mini{padding:6px 9px}

  /* 网格 */
  main{padding:12px 10px 72px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(124px,1fr));gap:9px}
  .meta{padding:7px 8px 9px}
  .meta h3{font-size:12.5px}
  #top{right:12px;bottom:calc(18px + env(safe-area-inset-bottom))}

  /* 大图灯箱：四周留边，点边缘的遮罩即可退出；面板按内容收缩，内容少时不会拖一片空白 */
  #modal{
    height:100%;height:100dvh;
    padding:16px;
    padding-top:max(16px, env(safe-area-inset-top));
    padding-bottom:max(16px, env(safe-area-inset-bottom));
  }
  .box{
    flex-direction:column;max-height:100%;border-radius:16px;
  }
  .box .pic{flex:0 0 auto;border-radius:16px 16px 0 0;max-height:48vh;min-height:0}
  .box .pic img{max-height:48vh}
  .info{padding:12px 14px}
  .info .desc{max-height:26vh}
  /* 手机上改用左右滑动翻页，箭头会浮在信息区挡住标签 */
  .nav{display:none}

  /* 筛选弹窗：四周留边，点边缘的遮罩就能退出；仍是三段式（头 / 可滚动主体 / 固定底栏） */
  #fmodal{
    align-items:stretch;height:100%;height:100dvh;
    padding:16px;
    /* 有刘海/横条时让出安全区，没有则保持 16px，不叠加 */
    padding-top:max(16px, env(safe-area-inset-top));
    padding-bottom:max(16px, env(safe-area-inset-bottom));
  }
  .fpanel{
    height:100%;max-height:100%;border-radius:16px;
    box-shadow:0 18px 50px rgba(0,0,0,.34);
  }
  .fhead{padding:10px 12px;gap:8px;flex:0 0 auto}
  .fhead h2{display:none}
  .fx{width:38px;height:38px;font-size:24px;padding:0;flex:0 0 auto}
  .fmbody{flex-direction:column;min-height:0}
  .fcol{padding:10px 12px;min-height:0}
  /* 分类：单行横向滑动，不占纵向空间；36 个分类靠左右滑都能选到 */
  .fcol:first-child{flex:0 0 auto}
  .fcol:first-child .fchips{
    flex:0 0 auto;flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;
    padding:0 0 6px;scrollbar-width:none;-webkit-overflow-scrolling:touch;
  }
  .fcol:first-child .fchips::-webkit-scrollbar{display:none}
  /* 横向滑动行里的胶囊不能被压缩，否则文字会竖排换行 */
  .fcol:first-child .chip{flex:0 0 auto;white-space:nowrap}
  /* 标签：吃掉剩余全部高度，内部纵向滚动 */
  .fcol:last-child{flex:1 1 auto;min-height:0}
  .fcol + .fcol{border-left:0;border-top:1px solid var(--line)}
  .fcol h3{margin-bottom:8px}
  .fchips{gap:7px;-webkit-overflow-scrolling:touch;padding-bottom:4px}
  .chip{padding:6px 11px;font-size:13px;min-height:33px}

  /* 底栏：已选条件单独一行、按钮靠右；安全区已由 #fmodal 的 padding 让出 */
  .ffoot{
    flex:0 0 auto;flex-wrap:wrap;gap:8px;padding:8px 12px;
  }
  .fsel{flex:1 1 100%;order:1;max-height:76px}
  .fact{flex:1 1 100%;order:2;justify-content:flex-end}
  .btn{padding:9px 16px}
}
</style>
</head>
<body>

<header>
  <div class="bar">
    <div class="row1">
      <h1 class="brand">PicaComic 收藏画廊<em id="count"></em></h1>
      <div class="search" id="searchbox">
        <span class="ico">🔍</span>
        <input id="q" type="search" placeholder="搜索标题 / 作者 / 汉化组 / 标签…（按 / 聚焦）" autocomplete="off">
        <button class="clr" id="qclr" title="清空">×</button>
      </div>
      <div class="tools">
        <select id="sort" title="排序方式">
          <option value="default">默认顺序</option>
          <option value="title">按标题</option>
          <option value="pages">按页数（多→少）</option>
          <option value="author">按作者</option>
        </select>
        <button class="btn" id="reset">重置</button>
      </div>
    </div>
    <div class="selbar" id="selbar" hidden></div>
    <div class="filters">
      <div class="frow">
        <span class="flabel">分类</span>
        <div class="chips" id="cat-chips"></div>
      </div>
      <div class="frow">
        <span class="flabel">标签<button class="mini off" id="tagmode" title="多选时的匹配方式">任一</button></span>
        <div class="fbody">
          <div class="tbar">
            <input id="tagq" class="tagq" placeholder="搜索标签…" autocomplete="off">
            <button class="mini" id="tagsort" title="切换标签排序方式">数量↓</button>
            <button class="mini" id="tagmore" title="打开全部筛选面板">查看全部</button>
          </div>
          <div class="chips" id="tag-chips"></div>
          <div class="tagempty" id="tagempty" hidden>没有匹配的标签</div>
        </div>
      </div>
    </div>
  </div>
</header>

<main>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" hidden>没有符合条件的漫画</div>
  <div class="loadmore" id="loadmore" hidden><button class="btn" id="morebtn">加载更多</button></div>
  <div id="sentinel"></div>
</main>

<button id="top" title="回到顶部">↑</button>

<div id="fmodal" hidden>
  <div class="fmask" data-fclose></div>
  <div class="fpanel">
    <div class="fhead">
      <h2>筛选</h2>
      <input id="fq" class="fq" placeholder="搜索分类 / 标签…" autocomplete="off">
      <button class="fx" data-fclose title="关闭 (Esc)">×</button>
    </div>
    <div class="fmbody">
      <section class="fcol">
        <h3>分类<em id="fcatinfo"></em></h3>
        <div class="fchips" id="fcat"></div>
      </section>
      <section class="fcol">
        <h3>标签
          <button class="mini off" id="ftagmode" title="多选时的匹配方式">任一</button>
          <button class="mini" id="ftagsort" title="切换排序方式">数量↓</button>
          <em id="ftaginfo"></em>
        </h3>
        <div class="fchips" id="ftag"></div>
      </section>
    </div>
    <div class="ffoot">
      <div class="fsel" id="fsel"></div>
      <div class="fact">
        <span id="fcount"></span>
        <button class="btn" id="fclear">清空</button>
        <button class="btn primary" id="fdone">完成</button>
      </div>
    </div>
  </div>
</div>

<div id="modal" hidden>
  <div class="mask" data-close></div>
  <div class="box">
    <button class="close" data-close title="关闭 (Esc)">×</button>
    <button class="nav" id="mprev" title="上一部 (←)">‹</button>
    <button class="nav" id="mnext" title="下一部 (→)">›</button>
    <div class="pic">
      <div class="spin" id="mspin"></div>
      <div class="miss" id="mmiss" hidden></div>
      <img id="mimg" alt="">
    </div>
    <div class="info">
      <h2 id="mtitle"></h2>
      <p class="kv">作者：<b id="mauthor"></b></p>
      <p class="kv">页数：<b id="mpages"></b></p>
      <p class="kv">汉化组：<b id="mteam"></b></p>
      <p class="kv">上传者：<b id="muploader"></b></p>
      <div class="badges" id="mbadges"></div>
      <div class="desc" id="mdesc"></div>
      <a class="link" id="mlink" target="_blank" rel="noopener">在新标签打开原图 ↗</a>
    </div>

    for (var p = 0; p < tagOrder.length; p++) host.appendChild(tagChips[tagOrder[p]]);

    var q = $('tagq').value.trim().toLowerCase();

      else vis = p < TAG_PREVIEW || state.tags.indexOf(ti) >= 0;
      el.classList.toggle('hide', !vis);
      if (vis) shown++;
    }
    $('tagempty').hidden = shown > 0;
  }

    if (!modalBuilt) return;

    for (var p = 0; p < tagOrder.length; p++) {
      var el = mTagChips[tagOrder[p]];
      if (el) host.appendChild(el);
    }

    if (!modalBuilt) return;

      vis = !q || CATS[i].toLowerCase().indexOf(q) >= 0;
      el.classList.toggle('hide', !vis);
      if (vis) cShow++;
    }
    for (i = 0; i < TAGS.length; i++) {
      el = mTagChips[i];
      if (!el) continue;
      vis = !q || TAGS[i].toLowerCase().indexOf(q) >= 0;
      el.classList.toggle('hide', !vis);
      if (vis) tShow++;

    $('fcatinfo').textContent = cShow + ' / ' + CATS.length;

      var b = list[i];
      if (!b) continue;
      b.textContent = label;
      b.title = tip;
      b.classList.toggle('off', and);

    var box = $('fsel');

    if (!state.cats.length && !state.tags.length) {
      var tip = document.createElement('span');
      tip.className = 'slab';

    state.tags.forEach(function (ti) { box.appendChild(selChip(TAGS[ti], 'tag', ti)); });
  }

  function openFilter() {
    ensureModal();
    filterModal();
    renderFsel();
    $('fmodal').hidden = false;
    document.body.classList.add('lock');
    $('fcount').textContent = '当前 ' + filtered.length + ' 部';
  }

  function closeFilter() {
    $('fmodal').hidden = true;
    if ($('modal').hidden) document.body.classList.remove('lock');

  /* ───────── 筛选计算（同时算出 facet 计数） ───────── */

        } else {
          okT = false;
          for (j = 0; j < st.length; j++) if (ck.indexOf(st[j]) !== -1) { okT = true; break; }
        }
      }
      if (sc.length) {
        for (j = 0; j < sc.length; j++) if (cc.indexOf(sc[j]) === -1) { okC = false; break; }
      }

      // 分类计数：排除分类自身条件（这样能看到「再加这个分类还剩多少」）
      if (okT) for (j = 0; j < cc.length; j++) catHit[cc[j]]++;
      // 标签计数：排除标签自身条件
      if (okC) for (j = 0; j < ck.length; j++) tagHit[ck[j]]++;

      if (okC && okT) out.push(c);
    }

    if (state.sort === 'title') {
      out.sort(function (x, y) { return x.t.localeCompare(y.t, 'zh'); });
    } else if (state.sort === 'pages') {
      out.sort(function (x, y) { return y.p - x.p; });
    } else if (state.sort === 'author') {
      out.sort(function (x, y) {
        return x.a.localeCompare(y.a, 'zh') || x.t.localeCompare(y.t, 'zh');
      });
    }
    return { list: out, catHit: catHit, tagHit: tagHit };
  }

  function paintSet(chips, hits, selected) {
    for (var i = 0; i < chips.length; i++) {
      var el = chips[i];
      if (!el) continue;
      var v = hits[i];
      setCount(el, v);
      el.classList.toggle('dead', v === 0 && selected.indexOf(i) === -1);
    }
  }

  function paintFacets(res) {
    paintSet(catChips, res.catHit, state.cats);
    paintSet(tagChips, res.tagHit, state.tags);
    if (modalBuilt) {
      paintSet(mCatChips, res.catHit, state.cats);
      paintSet(mTagChips, res.tagHit, state.tags);
    }
  }

  function setCount(el, n) {
    var i = el.lastChild;
    var s = String(n);
    if (i.textContent !== s) i.textContent = s;
  }

  /* ───────── 已选条件 ───────── */
  function renderSelbar() {
    var bar = $('selbar');
    if (!state.cats.length && !state.tags.length) {
      bar.hidden = true;
      bar.textContent = '';
      return;
    }
    bar.hidden = false;
    bar.textContent = '';
    var lab = document.createElement('span');
    lab.className = 'slab';
    lab.textContent = '已选';
    bar.appendChild(lab);

    state.cats.forEach(function (ci) { bar.appendChild(selChip(CATS[ci], 'cat', ci)); });
    state.tags.forEach(function (ti) { bar.appendChild(selChip(TAGS[ti], 'tag', ti)); });

    var clr = document.createElement('button');
    clr.type = 'button';
    clr.className = 'mini';
    clr.textContent = '清空筛选';
    clr.addEventListener('click', function () {
      state.cats = [];
      state.tags = [];
      syncChips();
      update(true);
    });
    bar.appendChild(clr);
  }

  function selChip(name, group, idx) {
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'chip on ' + group;
    b.dataset.v = idx;
    b.dataset.g = group;
    var s = document.createElement('span');
    s.textContent = name;
    var x = document.createElement('i');
    x.textContent = '×';
    b.appendChild(s);
    b.appendChild(x);
    return b;
  }

  function syncChips() {
    var i;
    for (i = 0; i < catChips.length; i++) {
      if (catChips[i]) catChips[i].classList.toggle('on', state.cats.indexOf(i) !== -1);
    }
    for (i = 0; i < tagChips.length; i++) {
      if (tagChips[i]) tagChips[i].classList.toggle('on', state.tags.indexOf(i) !== -1);
    }
    if (modalBuilt) {
      for (i = 0; i < mCatChips.length; i++) {
        if (mCatChips[i]) mCatChips[i].classList.toggle('on', state.cats.indexOf(i) !== -1);
      }
      for (i = 0; i < mTagChips.length; i++) {
        if (mTagChips[i]) mTagChips[i].classList.toggle('on', state.tags.indexOf(i) !== -1);
      }
    }
    layoutTags();
  }

  /* ───────── 交互 ───────── */
  function toggle(group, idx) {
    var arr = group === 'cat' ? state.cats : state.tags;
    var k = arr.indexOf(idx);
    if (k >= 0) arr.splice(k, 1);
    else arr.push(idx);
    syncChips();
    update(true);
  }

  document.addEventListener('click', function (e) {
    var el = e.target;
    while (el && el !== document.body && !el.classList.contains('chip')) el = el.parentNode;
    if (!el || el === document.body) return;
    var g = el.dataset.g, v = parseInt(el.dataset.v, 10);
    if (!g || isNaN(v)) return;
    // 当前条件下命中 0 部的标签不可再选（避免点进死胡同）
    if (el.classList.contains('dead') && !el.classList.contains('on')) return;
    toggle(g, v);
  });

  $('tagq').addEventListener('input', layoutTags);

  $('tagmore').addEventListener('click', openFilter);

  $('tagsort').addEventListener('click', function () {
    tagSort = tagSort === 'count' ? 'name' : 'count';
    sortTags();
  });
  $('ftagsort').addEventListener('click', function () {
    tagSort = tagSort === 'count' ? 'name' : 'count';
    sortTags();
  });

  $('tagmode').addEventListener('click', function () {
    state.tagMode = state.tagMode === 'and' ? 'or' : 'and';
    syncMode();
    update(true);
  });
  $('ftagmode').addEventListener('click', function () {
    state.tagMode = state.tagMode === 'and' ? 'or' : 'and';
    syncMode();
    update(true);
  });

  /* ───────── 筛选弹窗交互 ───────── */
  $('fq').addEventListener('input', filterModal);
  $('fmodal').addEventListener('click', function (e) {
    if (e.target.hasAttribute('data-fclose')) closeFilter();
  });
  $('fdone').addEventListener('click', closeFilter);
  $('fclear').addEventListener('click', function () {
    state.cats = [];
    state.tags = [];
    syncChips();
    update(true);
  });

  /* ───────── 搜索 / 排序 / 重置 ───────── */
  var timer = null;
  $('q').addEventListener('input', function () {
    var v = this.value;
    $('searchbox').classList.toggle('has', v.length > 0);
    clearTimeout(timer);
    timer = setTimeout(function () { state.q = v; update(true); }, 140);
  });
  $('qclr').addEventListener('click', function () {
    $('q').value = '';
    state.q = '';
    $('searchbox').classList.remove('has');
    update(true);
    $('q').focus();
  });
  $('sort').addEventListener('change', function () { state.sort = this.value; update(true); });
  $('reset').addEventListener('click', function () {
    state.q = ''; state.cats = []; state.tags = []; state.sort = 'default';
    state.tagMode = 'and';
    $('q').value = '';
    $('searchbox').classList.remove('has');
    $('sort').value = 'default';
    $('tagq').value = '';
    $('fq').value = '';
    syncMode();
    syncChips();
    update(true);
  });

  /* 图片地址：优先用记录里自带的外链，没有就退回本地相对路径 */
  function thumbSrc(c) { return c.tu || (THUMB + c.i + '.jpg'); }
  function largeSrc(c) { return c.lu || (LARGE + c.i + '.jpg'); }

  /* ───────── 卡片渲染 ───────── */
  function badge(cls, text, group, idx) {
    var e = document.createElement('button');
    e.type = 'button';
    e.className = 'b ' + cls;
    e.textContent = text;
    if (group) {
      e.dataset.fg = group;
      e.dataset.fv = idx;
      e.title = '按「' + text + '」筛选';
    } else {
      e.style.cursor = 'default';
    }
    return e;
  }

  function makeCard(c, idx) {
    var card = document.createElement('article');
    card.className = 'card';
    card.dataset.idx = idx;

    var box = document.createElement('div');
    box.className = 'thumb';
    if (NOIMG[c.i]) {
      box.className = 'thumb noimg';
    } else {
      var img = document.createElement('img');
      img.loading = 'lazy';
      img.decoding = 'async';
      img.alt = c.t;
      if (idx < 8) img.setAttribute('fetchpriority', 'high');
      img.onerror = function () { box.classList.add('noimg'); this.remove(); };
      img.src = thumbSrc(c);
      box.appendChild(img);
    }
    card.appendChild(box);

    var meta = document.createElement('div');
    meta.className = 'meta';
    var h = document.createElement('h3');
    h.textContent = c.t;
    h.title = c.t;
    meta.appendChild(h);

    var p = document.createElement('p');
    p.className = 'author';
    p.textContent = c.a;
    meta.appendChild(p);

    var bs = document.createElement('div');
    bs.className = 'badges';
    var i;
    for (i = 0; i < c.c.length && i < 2; i++) bs.appendChild(badge('cat', CATS[c.c[i]], 'cat', c.c[i]));
    if (c.p) bs.appendChild(badge('pg', c.p + 'P'));
    for (i = 0; i < c.k.length && i < 2; i++) bs.appendChild(badge('tag', TAGS[c.k[i]], 'tag', c.k[i]));
    meta.appendChild(bs);

    card.appendChild(meta);
    return card;
  }

  function appendBatch(count) {
    var start = rendered;
    var end = Math.min(rendered + count, filtered.length);
    if (end <= start) return 0;
    var frag = document.createDocumentFragment();
    for (var i = start; i < end; i++) frag.appendChild(makeCard(filtered[i], i));
    GRID.appendChild(frag);
    rendered = end;
    return end - start;
  }

  function updateMore() {
    $('loadmore').hidden = rendered >= filtered.length || filtered.length === 0;
  }

  var pumping = false;
  function pump() {
    if (pumping) return;
    pumping = true;
    requestAnimationFrame(function () {
      pumping = false;
      var guard = 0;
      while (rendered < filtered.length && guard++ < 6 &&
             SENT.getBoundingClientRect().top < window.innerHeight + 700) {
        appendBatch(BATCH);
      }
      updateMore();
    });
  }

  function update(scrollTop) {
    var res = compute();
    lastRes = res;
    filtered = res.list;
    rendered = 0;
    current = -1;
    GRID.textContent = '';
    $('count').textContent = '共 ' + DATA.length + ' 部 · 当前 ' + filtered.length + ' 部';
    EMPTY.hidden = filtered.length > 0;
    paintFacets(res);
    renderSelbar();
    if (modalBuilt) {
      $('fcount').textContent = '当前 ' + filtered.length + ' 部';
      renderFsel();
    }
    appendBatch(FIRST);
    updateMore();
    pump();
    if (scrollTop) window.scrollTo(0, 0);
    saveHash();
  }

  /* ───────── 滚动加载 ───────── */
  var rafPending = false;
  function onScroll() {
    if (rafPending) return;
    rafPending = true;
    requestAnimationFrame(function () {
      rafPending = false;
      if (rendered < filtered.length &&
          SENT.getBoundingClientRect().top < window.innerHeight + 700) pump();
    });
  }
  window.addEventListener('scroll', onScroll, { passive: true });
  window.addEventListener('resize', onScroll, { passive: true });
  $('morebtn').addEventListener('click', function () { appendBatch(BATCH); updateMore(); });

  /* ───────── 模态框 ───────── */
  var modal = $('modal'), mimg = $('mimg'), mspin = $('mspin'), mmiss = $('mmiss');

  function preload(i) {
    if (i < 0 || i >= filtered.length) return;
    var im = new Image();
    im.src = largeSrc(filtered[i]);
  }

  function openAt(idx) {
    if (idx < 0 || idx >= filtered.length) return;
    current = idx;
    var c = filtered[idx];

    $('mtitle').textContent = c.t;
    $('mauthor').textContent = c.a;
    $('mpages').textContent = c.p || '未知';
    $('mteam').textContent = c.g;
    $('muploader').textContent = c.u;
    $('mdesc').textContent = c.d || '无简介';
    $('mdesc').style.display = c.d ? 'block' : 'none';

    var bs = $('mbadges');
    bs.textContent = '';
    var i;
    for (i = 0; i < c.c.length; i++) bs.appendChild(badge('cat', CATS[c.c[i]], 'cat', c.c[i]));
    for (i = 0; i < c.k.length; i++) bs.appendChild(badge('tag', TAGS[c.k[i]], 'tag', c.k[i]));

    var url = largeSrc(c);
    $('mlink').href = url;
    mimg.style.opacity = '0';
    mimg.alt = c.t;
    mmiss.hidden = true;
    mspin.hidden = false;
    mimg.onload = function () { mspin.hidden = true; mimg.style.opacity = '1'; };
    mimg.onerror = function () {
      mspin.hidden = true;
      mimg.style.opacity = '0';
      mmiss.textContent = '原图未下载\n运行 download_images.py 后可查看';
      mmiss.hidden = false;
    };
    mimg.src = url;

    $('mprev').disabled = idx <= 0;
    $('mnext').disabled = idx >= filtered.length - 1;
    modal.hidden = false;
    document.body.classList.add('lock');

    preload(idx + 1);
    preload(idx - 1);
  }

  function closeModal() {
    modal.hidden = true;
    document.body.classList.remove('lock');
    mimg.onload = mimg.onerror = null;
    mimg.removeAttribute('src');
    mimg.style.opacity = '0';
  }

  GRID.addEventListener('click', function (e) {
    var t = e.target;
    // 徽章优先：点击直接筛选，不打开详情
    if (t.dataset && t.dataset.fg) {
      e.stopPropagation();
      toggle(t.dataset.fg, parseInt(t.dataset.fv, 10));
      return;
    }
    var el = t;
    while (el && el !== GRID && !el.classList.contains('card')) el = el.parentNode;
    if (!el || el === GRID) return;
    openAt(parseInt(el.dataset.idx, 10));
  });

  $('mbadges').addEventListener('click', function (e) {
    var t = e.target;
    if (!t.dataset || !t.dataset.fg) return;
    closeModal();
    toggle(t.dataset.fg, parseInt(t.dataset.fv, 10));
  });

  modal.addEventListener('click', function (e) {
    if (e.target.hasAttribute('data-close')) closeModal();
  });
  $('mprev').addEventListener('click', function () { openAt(current - 1); });
  $('mnext').addEventListener('click', function () { openAt(current + 1); });

  /* 手机上箭头会浮在信息区上挡标签，改成左右滑动翻页 */
  (function () {
    var x0 = 0, y0 = 0, t0 = 0, tracking = false;
    modal.addEventListener('touchstart', function (e) {
      if (e.touches.length !== 1) { tracking = false; return; }
      // 只在图片区或非交互元素上滑动才翻页，避免误触标签按钮
      if (e.target.closest && e.target.closest('button, a')) { tracking = false; return; }
      tracking = true;
      x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; t0 = Date.now();
    }, { passive: true });
    modal.addEventListener('touchend', function (e) {
      if (!tracking) return;
      tracking = false;
      var t = e.changedTouches[0];
      var dx = t.clientX - x0, dy = t.clientY - y0;
      // 横向位移够大、纵向不明显、且够快，才算翻页
      if (Math.abs(dx) < 50 || Math.abs(dy) > Math.abs(dx) * .75) return;
      if (Date.now() - t0 > 900) return;
      if (dx < 0) { if (current < filtered.length - 1) openAt(current + 1); }
      else { if (current > 0) openAt(current - 1); }
    }, { passive: true });
  })();

  document.addEventListener('keydown', function (e) {
    var tag = (e.target.tagName || '').toLowerCase();
    var typing = tag === 'input' || tag === 'textarea' || tag === 'select';

    // 筛选面板优先级最高
    if (!$('fmodal').hidden) {
      if (e.key === 'Escape') closeFilter();
      return;
    }
    if (!modal.hidden) {
      if (e.key === 'Escape') closeModal();
      else if (e.key === 'ArrowLeft') openAt(current - 1);
      else if (e.key === 'ArrowRight') openAt(current + 1);
      return;
    }
    if (e.key === '/' && !typing) {
      e.preventDefault();
      $('q').focus();
    } else if (e.key === 'Escape' && typing && e.target.id === 'q') {
      $('q').value = '';
      state.q = '';
      $('searchbox').classList.remove('has');
      update(true);
    }
  });

  /* ───────── 回到顶部 ───────── */
  var topBtn = $('top');
  topBtn.addEventListener('click', function () { window.scrollTo(0, 0); });
  window.addEventListener('scroll', function () {
    topBtn.classList.toggle('show', window.pageYOffset > 600);
  }, { passive: true });

  /* ───────── URL 记忆筛选状态 ───────── */
  function saveHash() {
    var h = [];
    if (state.q) h.push('q=' + encodeURIComponent(state.q));
    if (state.cats.length) {
      h.push('c=' + state.cats.map(function (i) { return encodeURIComponent(CATS[i]); }).join(','));
    }
    if (state.tags.length) {
      h.push('t=' + state.tags.map(function (i) { return encodeURIComponent(TAGS[i]); }).join(','));
    }
    if (state.tagMode === 'or') h.push('m=or');
    if (state.sort !== 'default') h.push('s=' + state.sort);
    try {
      history.replaceState(null, '', h.length ? '#' + h.join('&') : location.pathname + location.search);
    } catch (err) { /* file:// 下部分浏览器禁止，忽略 */ }
  }

  function loadHash() {
    var h = location.hash.replace(/^#/, '');
    if (!h) return;
    h.split('&').forEach(function (kv) {
      var p = kv.split('=');
      var k = p[0], v = decodeURIComponent(p[1] || '');
      if (k === 'q' && v) {
        state.q = v;
        $('q').value = v;
        $('searchbox').classList.add('has');
      } else if (k === 'c' && v) {
        state.cats = v.split(',').map(function (n) { return CATS.indexOf(n); })
                      .filter(function (i) { return i >= 0; });
      } else if (k === 't' && v) {
        state.tags = v.split(',').map(function (n) { return TAGS.indexOf(n); })
                      .filter(function (i) { return i >= 0; });
      } else if (k === 'm' && v === 'or') {
        state.tagMode = 'or';
      } else if (k === 's' && v) {
        state.sort = v;
        $('sort').value = v;
      }
    });
  }

  /* ───────── 启动 ───────── */
  // 窄屏放不下长 placeholder，换成短的（否则会被截断成「…（按 / 聚」）
  if (window.matchMedia('(max-width:760px)').matches) {
    $('q').placeholder = '搜索标题 / 作者 / 标签…';
    $('tagq').placeholder = '搜索标签…';
  }
  initChips();
  loadHash();
  syncMode();
  syncChips();
  update(false);
})();
</script>
</body>
